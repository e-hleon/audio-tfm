name: audio-tfm

services:
  #------------- Gateway / Ingress -----------------------
  traefik:
    image: traefik:v3.0
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --log.level=INFO
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL","curl -fsS http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  #------------- Base de datos ---------------------------
  db:
    image: postgres:16
    restart: always
    healthcheck: { test: ["CMD-SHELL","pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 5s, timeout: 3s, retries: 30 }
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tfm
      TZ: ${TIMEZONE}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  #------------- Almacén de objetos ----------------------
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    ports:          # consola accesible sólo en LAN
      - "9000:9000"
      - "9001:9001"

  #------------- Broker ----------------------------------
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"   # panel web
    healthcheck:
        test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
        interval: 10s
        timeout: 5s
        retries: 5


  #------------- API de ingest ---------------------------
  ingest:
    build: ./ingest
    env_file: .env
    restart: unless-stopped
    depends_on:              # ✅ usa SOLO el formato mapeo
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_started
      minio:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.routers.ingest.rule=PathPrefix(`/`)
      - traefik.http.routers.ingest.entrypoints=web
      - traefik.http.services.ingest.loadbalancer.server.port=8000
      - traefik.docker.network=audio-tfm_default # fuerza la red para que Traefik hable con el contenedor correcto
    ports:                    # mantiene depuración directa
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL","curl -fsS http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  #------------- Worker transcribe -----------------------
  worker-transcribe:
    build: ./worker
    env_file: .env
    restart: unless-stopped
    profiles: ["cloud"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_started
      minio:
        condition: service_started

  #------------- Worker NLP / resumen --------------------
  worker-nlp:
    build: ./nlp
    env_file: .env
    restart: unless-stopped
    depends_on:
      rabbitmq: {condition: service_healthy}
      db:       {condition: service_started}
    profiles: ["summary"]     # ← NO se crea si ENABLE_SUMMARY=false

# ─────────── Speech-to-text backend (GPU o CPU) ────────────
  whisper-runtime-gpu:
    image: ghcr.io/ggml-org/whisper.cpp:main-cuda
    container_name: whisper-runtime
    restart: unless-stopped
    profiles: ["gpu"]
    gpus: all
    entrypoint: ["bash","-c","while true; do sleep 3600; done"]
    volumes:
      - ./models:/models
      - audio-share:/share
      - /usr/lib/wsl/lib:/usr/lib/wsl/lib:ro          # ← monta las libs del driver WSL
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib:/usr/local/cuda/targets/x86_64-linux/lib:/usr/local/cuda/lib64
    healthcheck:
      test: ["CMD-SHELL","nvidia-smi -L >/dev/null 2>&1 && whisper-cli -h >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  whisper-runtime-cpu:                # ← misma etiqueta de nombre (= alias)
    image: ghcr.io/ggml-org/whisper.cpp:main          # build sin CUDA
    container_name: whisper-runtime
    restart: unless-stopped
    profiles: ["cpu"]
    entrypoint: ["bash","-c","while true; do sleep 3600; done"]
    volumes:
      - ./models:/models
      - audio-share:/share
    healthcheck:
      test: ["CMD-SHELL","whisper-cli -h >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── Worker local (CPU o GPU) ─────────────────────────────
  worker-local:
    build: ./worker-local
    env_file: .env
    restart: unless-stopped
    depends_on:
      rabbitmq: {condition: service_healthy}
      db:       {condition: service_started}
      minio:    {condition: service_started}
    # Si levantas profile "gpu" este servicio encontrará el contenedor
    profiles: ["cpu","gpu"]
    volumes:
      - audio-share:/share
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WHISPER_BIN: whisper-cli

volumes:
  pgdata:
  minio-data:
  models:
  audio-share:
